# Opcional: levanta API + simulador + web en un solo contenedor de Node 24.
# Uso: docker compose up   → http://localhost:4200
services:
  wms:
    image: node:24-bookworm
    working_dir: /app
    command: sh -c "npm install && npm run dev:docker"
    environment:
      - DEMO_MODE=true
      - CORS_ORIGIN=http://localhost:4200
    ports:
      - "4200:4200"
      - "7071:7071"
    volumes:
      - .:/app
      - wms_node_modules:/app/node_modules
volumes:
  wms_node_modules:
